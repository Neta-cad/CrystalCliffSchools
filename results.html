<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrystalHub | Results</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070b12;
      --surface: #0d1321;
      --card: #111827;
      --accent: #00d4ff;
      --accent2: #7c3aed;
      --accent3: #10b981;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #1e293b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* NAV */
    nav {
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(8,12,20,0.95);
      border-bottom: 1px solid rgba(0,212,255,0.08);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 99;
    }

    .nav-logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--accent);
      text-decoration: none;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-user {
      font-size: 0.83rem;
      color: var(--muted);
    }

    .nav-back {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.83rem;
      transition: color 0.2s;
    }

    .nav-back:hover { color: var(--accent); }

    .logout-btn {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.2);
      color: #ef4444;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 600;
    }

    /* MAIN */
    .main {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    .page-header {
      margin-bottom: 32px;
    }

    .page-label {
      font-size: 0.72rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .page-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    /* TABS */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--muted);
      transition: all 0.2s;
      border: none;
      background: none;
    }

    .tab.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #000;
    }

    /* CARDS */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .card-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 20px;
      color: var(--accent);
    }

    /* FORM */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group.full { grid-column: 1/-1; }

    .form-label {
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 500;
    }

    .form-input, .form-select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }

    .form-input:focus, .form-select:focus {
      border-color: rgba(0,212,255,0.4);
    }

    .form-select option { background: var(--card); }

    .submit-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #000;
      padding: 12px 28px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: 'Syne', sans-serif;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 20px rgba(0,212,255,0.2);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(0,212,255,0.35);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* MESSAGES */
    .msg {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
    }

    .msg.error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.2);
      color: #ef4444;
    }

    .msg.success {
      background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.2);
      color: var(--accent3);
    }

    /* RESULTS TABLE */
    .results-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }

    .results-table th {
      text-align: left;
      padding: 12px 16px;
      font-size: 0.72rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-bottom: 1px solid var(--border);
      font-family: 'Syne', sans-serif;
    }

    .results-table td {
      padding: 14px 16px;
      font-size: 0.88rem;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }

    .results-table tr:last-child td { border-bottom: none; }
    .results-table tr:hover td { background: rgba(0,212,255,0.03); }

    .grade-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 700;
      font-family: 'Syne', sans-serif;
    }

    .grade-a { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.2); }
    .grade-b { background: rgba(0,212,255,0.15); color: #00d4ff; border: 1px solid rgba(0,212,255,0.2); }
    .grade-c { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.2); }
    .grade-d { background: rgba(249,115,22,0.15); color: #f97316; border: 1px solid rgba(249,115,22,0.2); }
    .grade-f { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }

    /* FILTER ROW */
    .filter-row {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-row .form-select {
      flex: 1;
      min-width: 140px;
    }

    .filter-btn {
      background: rgba(0,212,255,0.1);
      border: 1px solid rgba(0,212,255,0.2);
      color: var(--accent);
      padding: 11px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .filter-btn:hover { background: rgba(0,212,255,0.2); }

    /* STATS ROW */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .stat-num {
      font-family: 'Syne', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent);
    }

    .stat-label {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 4px;
    }

    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }

    .empty-state-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state h3 {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
      margin-bottom: 8px;
    }

    /* LOADING */
    .loading-spinner {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }

    /* DELETE BTN */
    .delete-btn {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 1rem;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .delete-btn:hover { background: rgba(239,68,68,0.1); }

    /* NOT AUTHORIZED */
    .not-authorized {
      text-align: center;
      padding: 60px 20px;
    }

    .not-authorized h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 12px;
    }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .results-table th:nth-child(4),
      .results-table td:nth-child(4) { display: none; }
    }
  </style>
</head>
<body>

<nav>
  <a href="Portal.html" class="nav-logo">✨ CrystalHub</a>
  <div class="nav-right">
    <span class="nav-user" id="navUser"></span>
    <a href="Portal.html" class="nav-back">← Dashboard</a>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="main" id="mainContent">
  <div class="loading-spinner">⏳ Loading...</div>
</div>

<script>
  const SUPABASE_URL = 'https://cyeretlyfxmponybizrm.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5ZXJldGx5ZnhtcG9ueWJpenJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MjIzNzUsImV4cCI6MjA5NTE5ODM3NX0.pVmmH34yJB74UjfWwVwT0odyP5_6Y0qgsp-Hq3Pqutg';

  let currentUser = null;
  let token = null;
  let allResults = [];

  // Get grade from score
  function getGrade(score) {
    if (score >= 75) return 'A1';
    if (score >= 70) return 'B2';
    if (score >= 65) return 'B3';
    if (score >= 60) return 'C4';
    if (score >= 55) return 'C5';
    if (score >= 50) return 'C6';
    if (score >= 45) return 'D7';
    if (score >= 40) return 'E8';
    return 'F9';
  }

  // Get grade class
  function getGradeClass(grade) {
    if (grade.startsWith('A')) return 'grade-a';
    if (grade.startsWith('B')) return 'grade-b';
    if (grade.startsWith('C')) return 'grade-c';
    if (grade.startsWith('D') || grade.startsWith('E')) return 'grade-d';
    return 'grade-f';
  }

  // Fetch with auth
  async function fetchData(endpoint, options = {}) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, {
      ...options,
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation',
        ...options.headers
      }
    });
    return res.json();
  }

  // Load teacher view
  function loadTeacherView() {
    document.getElementById('mainContent').innerHTML = `
      <div class="page-header">
        <div class="page-label">Results Management</div>
        <h1 class="page-title">📊 Manage Results</h1>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="switchTab('add', this)">➕ Add Result</button>
        <button class="tab" onclick="switchTab('view', this)">📋 View Results</button>
      </div>

      <!-- ADD RESULT TAB -->
      <div id="addTab">
        <div class="card">
          <div class="card-title">Add Student Result</div>
          <div class="msg error" id="addError"></div>
          <div class="msg success" id="addSuccess"></div>
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">Student Email</label>
              <input class="form-input" type="email" id="studentEmail" placeholder="student@email.com">
            </div>
            <div class="form-group">
              <label class="form-label">Subject</label>
              <input class="form-input" type="text" id="subjectInput" placeholder="e.g. Mathematics">
            </div>
            <div class="form-group">
              <label class="form-label">Score (0-100)</label>
              <input class="form-input" type="number" id="scoreInput" placeholder="e.g. 85" min="0" max="100">
            </div>
            <div class="form-group">
              <label class="form-label">Term</label>
              <select class="form-select" id="termInput">
                <option>First Term</option>
                <option>Second Term</option>
                <option>Third Term</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Session</label>
              <input class="form-input" type="text" id="sessionInput" placeholder="e.g. 2024/2025">
            </div>
            <div class="form-group">
              <label class="form-label">Class</label>
              <input class="form-input" type="text" id="classInputResult" placeholder="e.g. JSS 2A">
            </div>
          </div>
          <button class="submit-btn" onclick="addResult()">Save Result →</button>
        </div>
      </div>

      <!-- VIEW RESULTS TAB -->
      <div id="viewTab" style="display:none;">
        <div class="card">
          <div class="card-title">All Results</div>
          <div class="filter-row">
            <select class="form-select" id="filterTerm">
              <option value="">All Terms</option>
              <option>First Term</option>
              <option>Second Term</option>
              <option>Third Term</option>
            </select>
            <select class="form-select" id="filterSession">
              <option value="">All Sessions</option>
              <option>2024/2025</option>
              <option>2025/2026</option>
            </select>
            <button class="filter-btn" onclick="loadTeacherResults()">🔍 Filter</button>
          </div>
          <div id="teacherResultsContainer">
            <div class="loading-spinner">⏳ Loading results...</div>
          </div>
        </div>
      </div>
    `;
    loadTeacherResults();
  }

  // Switch tabs
  function switchTab(tab, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    if (tab === 'add') {
      document.getElementById('addTab').style.display = 'block';
      document.getElementById('viewTab').style.display = 'none';
    } else {
      document.getElementById('addTab').style.display = 'none';
      document.getElementById('viewTab').style.display = 'block';
      loadTeacherResults();
    }
  }

  // Add result
  async function addResult() {
    const studentEmail = document.getElementById('studentEmail').value.trim();
    const subject = document.getElementById('subjectInput').value.trim();
    const score = parseInt(document.getElementById('scoreInput').value);
    const term = document.getElementById('termInput').value;
    const session = document.getElementById('sessionInput').value.trim();
    const className = document.getElementById('classInputResult').value.trim();

    const errorEl = document.getElementById('addError');
    const successEl = document.getElementById('addSuccess');

    errorEl.style.display = 'none';
    successEl.style.display = 'none';

    if (!studentEmail || !subject || isNaN(score) || !session || !className) {
      errorEl.textContent = 'Please fill in all fields!';
      errorEl.style.display = 'block';
      return;
    }

    if (score < 0 || score > 100) {
      errorEl.textContent = 'Score must be between 0 and 100!';
      errorEl.style.display = 'block';
      return;
    }

    // Find student by email
    const students = await fetchData(`users?email=eq.${studentEmail}&role=eq.student&select=id,full_name`);

    if (!students || students.length === 0) {
      errorEl.textContent = 'Student not found! Make sure the email is correct.';
      errorEl.style.display = 'block';
      return;
    }

    const student = students[0];
    const grade = getGrade(score);

    const result = await fetchData('results', {
      method: 'POST',
      body: JSON.stringify({
        student_id: student.id,
        subject,
        score,
        grade,
        term,
        session,
        class: className,
        teacher_id: currentUser.id
      })
    });

    if (result && result[0]) {
      successEl.textContent = `✅ Result saved for ${student.full_name} — ${subject}: ${score}/100 (${grade})`;
      successEl.style.display = 'block';
      document.getElementById('studentEmail').value = '';
      document.getElementById('subjectInput').value = '';
      document.getElementById('scoreInput').value = '';
      document.getElementById('sessionInput').value = '';
      document.getElementById('classInputResult').value = '';
    } else {
      errorEl.textContent = 'Failed to save result. Try again!';
      errorEl.style.display = 'block';
    }
  }

  // Load teacher results
  async function loadTeacherResults() {
    const container = document.getElementById('teacherResultsContainer');
    if (!container) return;

    container.innerHTML = '<div class="loading-spinner">⏳ Loading...</div>';

    const term = document.getElementById('filterTerm')?.value || '';
    const session = document.getElementById('filterSession')?.value || '';

    let endpoint = `results?teacher_id=eq.${currentUser.id}&select=*,users!results_student_id_fkey(full_name,email)&order=created_at.desc`;
    if (term) endpoint += `&term=eq.${encodeURIComponent(term)}`;
    if (session) endpoint += `&session=eq.${encodeURIComponent(session)}`;

    const results = await fetchData(endpoint);

    if (!results || results.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">📊</div>
          <h3>No Results Yet</h3>
          <p>Add your first student result using the form above.</p>
        </div>`;
      return;
    }

    container.innerHTML = `
      <div style="overflow-x:auto;">
        <table class="results-table">
          <thead>
            <tr>
              <th>Student</th>
              <th>Subject</th>
              <th>Score</th>
              <th>Grade</th>
              <th>Term</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            ${results.map(r => `
              <tr>
                <td>${r.users?.full_name || 'Unknown'}</td>
                <td>${r.subject}</td>
                <td>${r.score}/100</td>
                <td><span class="grade-badge ${getGradeClass(r.grade)}">${r.grade}</span></td>
                <td>${r.term}</td>
                <td><button class="delete-btn" onclick="deleteResult('${r.id}')">🗑️</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  }

  // Delete result
  async function deleteResult(id) {
    if (!confirm('Delete this result?')) return;
    await fetchData(`results?id=eq.${id}`, { method: 'DELETE' });
    loadTeacherResults();
  }

  // Load student view
  async function loadStudentView() {
    document.getElementById('mainContent').innerHTML = `
      <div class="page-header">
        <div class="page-label">My Academic Performance</div>
        <h1 class="page-title">📊 My Results</h1>
      </div>

      <div class="stats-row" id="statsRow">
        <div class="stat-card">
          <div class="stat-num" id="totalSubjects">-</div>
          <div class="stat-label">Subjects</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="avgScore">-</div>
          <div class="stat-label">Average Score</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="highestScore">-</div>
          <div class="stat-label">Highest Score</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="passCount">-</div>
          <div class="stat-label">Passed</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">My Result Sheet</div>
        <div class="filter-row">
          <select class="form-select" id="studentFilterTerm">
            <option value="">All Terms</option>
            <option>First Term</option>
            <option>Second Term</option>
            <option>Third Term</option>
          </select>
          <select class="form-select" id="studentFilterSession">
            <option value="">All Sessions</option>
            <option>2024/2025</option>
            <option>2025/2026</option>
          </select>
          <button class="filter-btn" onclick="loadStudentResults()">🔍 Filter</button>
        </div>
        <div id="studentResultsContainer">
          <div class="loading-spinner">⏳ Loading your results...</div>
        </div>
      </div>
    `;
    loadStudentResults();
  }

  // Load student results
  async function loadStudentResults() {
    const container = document.getElementById('studentResultsContainer');
    if (!container) return;

    container.innerHTML = '<div class="loading-spinner">⏳ Loading...</div>';

    const term = document.getElementById('studentFilterTerm')?.value || '';
    const session = document.getElementById('studentFilterSession')?.value || '';

    let endpoint = `results?student_id=eq.${currentUser.id}&order=created_at.desc`;
    if (term) endpoint += `&term=eq.${encodeURIComponent(term)}`;
    if (session) endpoint += `&session=eq.${encodeURIComponent(session)}`;

    const results = await fetchData(endpoint);

    if (!results || results.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">📊</div>
          <h3>No Results Yet</h3>
          <p>Your results will appear here once your teachers add them.</p>
        </div>`;

      document.getElementById('totalSubjects').textContent = '0';
      document.getElementById('avgScore').textContent = '0%';
      document.getElementById('highestScore').textContent = '0';
      document.getElementById('passCount').textContent = '0';
      return;
    }

    // Calculate stats
    const scores = results.map(r => r.score);
    const avg = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
    const highest = Math.max(...scores);
    const passed = results.filter(r => r.score >= 40).length;

    document.getElementById('totalSubjects').textContent = results.length;
    document.getElementById('avgScore').textContent = avg + '%';
    document.getElementById('highestScore').textContent = highest;
    document.getElementById('passCount').textContent = passed;

    container.innerHTML = `
      <div style="overflow-x:auto;">
        <table class="results-table">
          <thead>
            <tr>
              <th>Subject</th>
              <th>Score</th>
              <th>Grade</th>
              <th>Term</th>
              <th>Session</th>
            </tr>
          </thead>
          <tbody>
            ${results.map(r => `
              <tr>
                <td><strong>${r.subject}</strong></td>
                <td>${r.score}/100</td>
                <td><span class="grade-badge ${getGradeClass(r.grade)}">${r.grade}</span></td>
                <td>${r.term}</td>
                <td>${r.session}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  }

  // Load admin view
  async function loadAdminView() {
    document.getElementById('mainContent').innerHTML = `
      <div class="page-header">
        <div class="page-label">Admin — Results Overview</div>
        <h1 class="page-title">📊 All Results</h1>
      </div>
      <div class="card">
        <div class="card-title">All Student Results</div>
        <div class="filter-row">
          <select class="form-select" id="adminFilterTerm">
            <option value="">All Terms</option>
            <option>First Term</option>
            <option>Second Term</option>
            <option>Third Term</option>
          </select>
          <button class="filter-btn" onclick="loadAdminResults()">🔍 Filter</button>
        </div>
        <div id="adminResultsContainer">
          <div class="loading-spinner">⏳ Loading...</div>
        </div>
      </div>
    `;
    loadAdminResults();
  }

  // Load admin results
  async function loadAdminResults() {
    const container = document.getElementById('adminResultsContainer');
    container.innerHTML = '<div class="loading-spinner">⏳ Loading...</div>';

    const term = document.getElementById('adminFilterTerm')?.value || '';
    let endpoint = `results?select=*,users!results_student_id_fkey(full_name)&order=created_at.desc`;
    if (term) endpoint += `&term=eq.${encodeURIComponent(term)}`;

    const results = await fetchData(endpoint);

    if (!results || results.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">📊</div>
          <h3>No Results Yet</h3>
          <p>Results will appear here once teachers add them.</p>
        </div>`;
      return;
    }

    container.innerHTML = `
      <div style="overflow-x:auto;">
        <table class="results-table">
          <thead>
            <tr>
              <th>Student</th>
              <th>Subject</th>
              <th>Score</th>
              <th>Grade</th>
              <th>Term</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            ${results.map(r => `
              <tr>
                <td>${r.users?.full_name || 'Unknown'}</td>
                <td>${r.subject}</td>
                <td>${r.score}/100</td>
                <td><span class="grade-badge ${getGradeClass(r.grade)}">${r.grade}</span></td>
                <td>${r.term}</td>
                <td><button class="delete-btn" onclick="deleteResult('${r.id}')">🗑️</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  }

  // Logout
  function logout() {
    localStorage.removeItem('ccs_token');
    localStorage.removeItem('ccs_user');
    window.location.href = 'Portal.html';
  }

  // Init
  window.addEventListener('load', () => {
    token = localStorage.getItem('ccs_token');
    const userStr = localStorage.getItem('ccs_user');

    if (!token || !userStr) {
      window.location.href = 'Portal.html';
      return;
    }

    currentUser = JSON.parse(userStr);
    document.getElementById('navUser').textContent = currentUser.full_name || currentUser.email;

    if (currentUser.role === 'teacher') {
      loadTeacherView();
    } else if (currentUser.role === 'student') {
      loadStudentView();
    } else if (currentUser.role === 'admin') {
      loadAdminView();
    }
  });
</script>
</body>
</html>

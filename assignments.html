<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg: #070b12;
      --surface: #0d1321;
      --card: #111827;
      --accent: #00d4ff;
      --accent2: #7c3aed;
      --accent3: #10b981;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #1e293b;

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    nav { padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; background: rgba(8,12,20,0.95); border-bottom: 1px solid rgba(0,212,255,0.08); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 99; }
    .nav-logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.1rem; color: var(--accent); text-decoration: none; }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-user { font-size: 0.83rem; color: var(--muted); }
    .nav-back { color: var(--muted); text-decoration: none; font-size: 0.83rem; }
    .nav-back:hover { color: var(--accent); }
    .logout-btn { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: #ef4444; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 0.78rem; font-weight: 600; }
    .main { max-width: 900px; margin: 0 auto; padding: 32px 20px; }
    .page-header { margin-bottom: 32px; }
    .page-label { font-size: 0.72rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.15em; font-weight: 600; margin-bottom: 8px; }
    .page-title { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 800; letter-spacing: -0.02em; }
    .tabs { display: flex; gap: 8px; margin-bottom: 28px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 6px; }
    .tab { flex: 1; padding: 10px; text-align: center; border-radius: 8px; cursor: pointer; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.85rem; color: var(--muted); transition: all 0.2s; border: none; background: none; }
    .tab.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #000; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
    .card-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem; margin-bottom: 20px; color: var(--accent); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-group.full { grid-column: 1/-1; }
    .form-label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }
    .form-input, .form-select, .form-textarea { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.9rem; outline: none; transition: border-color 0.2s; width: 100%; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: rgba(0,212,255,0.4); }
    .form-select option { background: var(--card); }
    .form-textarea { height: 120px; resize: none; }
    .submit-btn { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #000; padding: 12px 28px; border: none; border-radius: 10px; font-weight: 700; font-size: 0.9rem; cursor: pointer; font-family: 'Syne', sans-serif; transition: transform 0.2s; box-shadow: 0 0 20px rgba(0,212,255,0.2); }
    .submit-btn:hover { transform: translateY(-2px); }
    .msg { padding: 12px 16px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 16px; display: none; }
    .msg.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: #ef4444; }
    .msg.success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.2); color: var(--accent3); }
    .assignment-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 16px; transition: border-color 0.2s; }
    .assignment-card:hover { border-color: rgba(0,212,255,0.2); }
    .assignment-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
    .assignment-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1rem; }
    .assignment-badge { display: inline-block; padding: 4px 12px; border-radius: 100px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; }
    .badge-pending { background: rgba(251,191,36,0.1); color: #fbbf24; border: 1px solid rgba(251,191,36,0.2); }
    .badge-submitted { background: rgba(16,185,129,0.1); color: var(--accent3); border: 1px solid rgba(16,185,129,0.2); }
    .badge-overdue { background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }
    .assignment-desc { color: var(--muted); font-size: 0.88rem; line-height: 1.6; margin-bottom: 16px; }
    .assignment-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); margin-bottom: 16px; }
    .assignment-meta span { display: flex; align-items: center; gap: 4px; }
    .assignment-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .action-btn { padding: 8px 16px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; font-family: 'Syne', sans-serif; }
    .action-btn.primary { background: rgba(0,212,255,0.1); color: var(--accent); border: 1px solid rgba(0,212,255,0.2); }
    .action-btn.primary:hover { background: rgba(0,212,255,0.2); }
    .action-btn.danger { background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }
    .action-btn.danger:hover { background: rgba(239,68,68,0.2); }
    .action-btn.success { background: rgba(16,185,129,0.1); color: var(--accent3); border: 1px solid rgba(16,185,129,0.2); }
    .action-btn.success:hover { background: rgba(16,185,129,0.2); }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
    .empty-state-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state h3 { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem; color: var(--text); margin-bottom: 8px; }
    .loading-spinner { text-align: center; padding: 40px; color: var(--muted); }
    .filter-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-row .form-select { flex: 1; min-width: 140px; }
    .filter-btn { background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.2); color: var(--accent); padding: 11px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.85rem; white-space: nowrap; }
    .submit-work-area { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); display: none; }
    .submit-work-area.show { display: block; }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
  </style>
</head>

async function fetchData(endpoint, options = {}) {
    const authToken = localStorage.getItem('ccs_token') || token;
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, {
      ...options,
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${authToken}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation',
        ...options.headers
      }
    });
    return res.json();

  // Check due date status
  function getDueStatus(dueDate) {
    const today = new Date();
    const due = new Date(dueDate);
    if (due < today) return 'overdue';
    return 'pending';
  }

  // Format date
  function formatDate(dateStr) {
    const date = new Date(dateStr);
    return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

  function switchTab(tab, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('createTab').style.display = tab === 'create' ? 'block' : 'none';
    document.getElementById('manageTab').style.display = tab === 'manage' ? 'block' : 'none';
    if (tab === 'manage') loadTeacherAssignments();
  }

  async function createAssignment() {
    const title = document.getElementById('assignTitle').value.trim();
    const desc = document.getElementById('assignDesc').value.trim();
    const subject = document.getElementById('assignSubject').value.trim();
    const className = document.getElementById('assignClass').value.trim();
    const dueDate = document.getElementById('assignDue').value;
    const maxScore = parseInt(document.getElementById('assignMax').value) || 100;

    const errorEl = document.getElementById('createError');
    const successEl = document.getElementById('createSuccess');
    errorEl.style.display = 'none';
    successEl.style.display = 'none';

    if (!title || !desc || !subject || !className || !dueDate) {
      errorEl.textContent = 'Please fill in all fields!';
      errorEl.style.display = 'block';
      return;
    }

    const authToken = localStorage.getItem('ccs_token');
const res = await fetch(`${SUPABASE_URL}/rest/v1/assignments`, {
  method: 'POST',
  headers: {
    'apikey': SUPABASE_KEY,
    'Authorization': `Bearer ${SUPABASE_KEY}`,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'

  body: JSON.stringify({
    title,
    description: desc,
    subject,
    class_name: className,
    due_date: dueDate,
    max_score: maxScore,
    teacher_id: currentUser.id

});
const result = await res.json();

    if (result && !result.error && !result.code) {
  successEl.textContent = '✅ Assignment created successfully!';

  document.getElementById('assignSubject').value = '';
  document.getElementById('assignClass').value = '';

} else {
  errorEl.textContent = 'Error: ' + JSON.stringify(result);

}
  }

  async function loadTeacherAssignments() {
    const container = document.getElementById('teacherAssignments');
    container.innerHTML = '<div class="loading-spinner">⏳ Loading...</div>';

    const assignments = await fetchData(`assignments?teacher_id=eq.${currentUser.id}&order=due_date.asc`);

    if (!assignments || assignments.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">📝</div>
          <h3>No Assignments Yet</h3>
          <p>Create your first assignment using the form above.</p>

      return;
    }

    container.innerHTML = assignments.map(a => `

        <div class="assignment-header">
          <div class="assignment-title">${a.title}</div>
          <span class="assignment-badge ${getDueStatus(a.due_date) === 'overdue' ? 'badge-overdue' : 'badge-pending'}">

        </div>

    `).join('');

    alert('✅ Assignment submitted successfully!\n\nYour teacher will review and grade your work.');

    `;

    const assignments = await fetchData(`assignments?order=due_date.asc`);

    const container = document.getElementById('adminAssignments');

    if (!assignments || assignments.length === 0) {
      container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📝</div><h3>No Assignments</h3><p>No assignments have been created yet.</p></div>`;
      return;
    }

    container.innerHTML = assignments.map(a => `
      <div class="assignment-card">
        <div class="assignment-header">
          <div class="assignment-title">${a.title}</div>
          <span class="assignment-badge ${getDueStatus(a.due_date) === 'overdue' ? 'badge-overdue' : 'badge-pending'}">
            ${getDueStatus(a.due_date) === 'overdue' ? '⚠️ Overdue' : '📅 Active'}
          </span>
        </div>
        <div class="assignment-desc">${a.description}</div>
        <div class="assignment-meta">
          <span>📚 ${a.subject}</span>
         <span>👥 ${a.class_name}</span>
          <span>📅 Due: ${formatDate(a.due_date)}</span>
        </div>
        <div class="assignment-actions">
          <button class="action-btn danger" onclick="deleteAssignment('${a.id}')">🗑️ Delete</button>
        </div>
      </div>
    `).join('');
  }

  function logout() {
    localStorage.removeItem('ccs_token');
    localStorage.removeItem('ccs_user');
    window.location.href = 'portal.html';
  }

  window.addEventListener('load', () => {
    token = localStorage.getItem('ccs_token');
    const userStr = localStorage.getItem('ccs_user');

    if (!token || !userStr) {
      window.location.href = 'portal.html';
      return;
    }

    currentUser = JSON.parse(userStr);
    document.getElementById('navUser').textContent = currentUser.full_name || currentUser.email;

    if (currentUser.role === 'teacher') {
      loadTeacherView();
    } else if (currentUser.role === 'student') {
      loadStudentView();
    } else if (currentUser.role === 'admin') {
      loadAdminView();
    } else {
      document.getElementById('mainContent').innerHTML = `
        <div style="text-align:center; padding:60px 20px;">
          <div style="font-size:3rem;">⚠️</div>
          <h2 style="font-family:'Syne',sans-serif; margin:16px 0 8px;">Role not found</h2>
          <p style="color:var(--muted);">Your account role is: ${currentUser.role || 'unknown'}</p>
          <a href="portal.html" style="color:var(--accent);">← Go back and login again</a>
        </div>`;
    }
  });
</script>
</body>
</html>

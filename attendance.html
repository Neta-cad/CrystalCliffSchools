<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrystalHub | Attendance</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070b12;
      --surface: #0d1321;
      --card: #111827;
      --accent: #00d4ff;
      --accent2: #7c3aed;
      --accent3: #10b981;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #1e293b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    nav { padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; background: rgba(8,12,20,0.95); border-bottom: 1px solid rgba(0,212,255,0.08); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 99; }
    .nav-logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.1rem; color: var(--accent); text-decoration: none; }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-user { font-size: 0.83rem; color: var(--muted); }
    .nav-back { color: var(--muted); text-decoration: none; font-size: 0.83rem; }
    .nav-back:hover { color: var(--accent); }
    .logout-btn { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: #ef4444; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 0.78rem; font-weight: 600; }
    .main { max-width: 900px; margin: 0 auto; padding: 32px 20px; }
    .page-header { margin-bottom: 32px; }
    .page-label { font-size: 0.72rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.15em; font-weight: 600; margin-bottom: 8px; }
    .page-title { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 800; letter-spacing: -0.02em; }
    .tabs { display: flex; gap: 8px; margin-bottom: 28px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 6px; }
    .tab { flex: 1; padding: 10px; text-align: center; border-radius: 8px; cursor: pointer; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.85rem; color: var(--muted); transition: all 0.2s; border: none; background: none; }
    .tab.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #000; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
    .card-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem; margin-bottom: 20px; color: var(--accent); }
    .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .form-label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }
    .form-input, .form-select { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.9rem; outline: none; transition: border-color 0.2s; width: 100%; }
    .form-input:focus, .form-select:focus { border-color: rgba(0,212,255,0.4); }
    .form-select option { background: var(--card); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .submit-btn { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #000; padding: 12px 28px; border: none; border-radius: 10px; font-weight: 700; font-size: 0.9rem; cursor: pointer; font-family: 'Syne', sans-serif; transition: transform 0.2s; box-shadow: 0 0 20px rgba(0,212,255,0.2); }
    .submit-btn:hover { transform: translateY(-2px); }
    .msg { padding: 12px 16px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 16px; display: none; }
    .msg.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: #ef4444; }
    .msg.success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.2); color: var(--accent3); }
    .student-list { display: flex; flex-direction: column; gap: 12px; }
    .student-row { display: flex; align-items: center; justify-content: space-between; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; flex-wrap: wrap; gap: 12px; }
    .student-info { display: flex; align-items: center; gap: 12px; }
    .student-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 0.9rem; color: #000; flex-shrink: 0; }
    .student-name { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.9rem; }
    .student-email { color: var(--muted); font-size: 0.78rem; }
    .status-btns { display: flex; gap: 8px; }
    .status-btn { padding: 6px 14px; border-radius: 8px; font-size: 0.78rem; font-weight: 700; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; font-family: 'Syne', sans-serif; }
    .status-btn.present { background: rgba(16,185,129,0.1); color: var(--accent3); border-color: rgba(16,185,129,0.2); }
    .status-btn.present.selected { background: var(--accent3); color: #000; border-color: var(--accent3); }
    .status-btn.absent { background: rgba(239,68,68,0.1); color: #ef4444; border-color: rgba(239,68,68,0.2); }
    .status-btn.absent.selected { background: #ef4444; color: #fff; border-color: #ef4444; }
    .status-btn.late { background: rgba(251,191,36,0.1); color: #fbbf24; border-color: rgba(251,191,36,0.2); }
    .status-btn.late.selected { background: #fbbf24; color: #000; border-color: #fbbf24; }
    .attendance-badge { display: inline-block; padding: 4px 12px; border-radius: 100px; font-size: 0.72rem; font-weight: 700; }
    .badge-present { background: rgba(16,185,129,0.1); color: var(--accent3); border: 1px solid rgba(16,185,129,0.2); }
    .badge-absent { background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }
    .badge-late { background: rgba(251,191,36,0.1); color: #fbbf24; border: 1px solid rgba(251,191,36,0.2); }
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; }
    .stat-num { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 800; color: var(--accent); }
    .stat-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px; }
    .attendance-table { width: 100%; border-collapse: collapse; }
    .attendance-table th { text-align: left; padding: 12px 16px; font-size: 0.72rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; border-bottom: 1px solid var(--border); font-family: 'Syne', sans-serif; }
    .attendance-table td { padding: 14px 16px; font-size: 0.88rem; border-bottom: 1px solid var(--border); }
    .attendance-table tr:last-child td { border-bottom: none; }
    .attendance-table tr:hover td { background: rgba(0,212,255,0.03); }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
    .empty-state-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state h3 { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem; color: var(--text); margin-bottom: 8px; }
    .loading-spinner { text-align: center; padding: 40px; color: var(--muted); }
    .filter-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-row .form-select { flex: 1; min-width: 140px; }
    .filter-btn { background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.2); color: var(--accent); padding: 11px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.85rem; white-space: nowrap; }
    .save-all-btn { width: 100%; background: linear-gradient(135deg, var(--accent3), #059669); color: #000; padding: 14px; border: none; border-radius: 10px; font-weight: 700; font-size: 0.95rem; cursor: pointer; font-family: 'Syne', sans-serif; margin-top: 16px; transition: transform 0.2s; }
    .save-all-btn:hover { transform: translateY(-2px); }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } .student-row { flex-direction: column; align-items: flex-start; } }
  </style>
</head>
<body>

<nav>
  <a href="portal.html" class="nav-logo">✨ CrystalHub</a>
  <div class="nav-right">
    <span class="nav-user" id="navUser"></span>
    <a href="portal.html" class="nav-back">← Dashboard</a>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="main" id="mainContent">
  <div class="loading-spinner">⏳ Loading...</div>
</div>

<script>
  const SUPABASE_URL = 'https://cyeretlyfxmponybizrm.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5ZXJldGx5ZnhtcG9ueWJpenJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MjIzNzUsImV4cCI6MjA5NTE5ODM3NX0.pVmmH34yJB74UjfWwVwT0odyP5_6Y0qgsp-Hq3Pqutg';

  let currentUser = null;
  let token = null;
  let attendanceMap = {};

  async function fetchData(endpoint, options = {}) {
    const authToken = localStorage.getItem('ccs_token') || token;
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, {
      ...options,
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${authToken}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation',
        'Accept-Profile': 'public',
        ...options.headers
      }
    });
    return res.json();
  }

  async function postData(table, body) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation',
        'Accept-Profile': 'public',
        'Content-Profile': 'public'
      },
      body: JSON.stringify(body)
    });
    return res.json();
  }

  function formatDate(dateStr) {
    const date = new Date(dateStr);
    return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  // ── TEACHER VIEW ──
  function loadTeacherView() {
    document.getElementById('mainContent').innerHTML = `
      <div class="page-header">
        <div class="page-label">Attendance Management</div>
        <h1 class="page-title">📅 Mark Attendance</h1>
      </div>
      <div class="tabs">
        <button class="tab active" onclick="switchTab('mark', this)">✅ Mark Today</button>
        <button class="tab" onclick="switchTab('history', this)">📋 History</button>
      </div>
      <div id="markTab">
        <div class="card">
          <div class="card-title">Select Class & Date</div>
          <div class="msg error" id="markError"></div>
          <div class="msg success" id="markSuccess"></div>
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">Class</label>
              <select class="form-select" id="attendClass">
                <option value="">Select Class</option>
                <optgroup label="Nursery">
                  <option>Nursery 1</option>
                  <option>Nursery 2</option>
                  <option>Nursery 3</option>
                </optgroup>
                <optgroup label="Primary">
                  <option>Primary 1</option>
                  <option>Primary 2</option>
                  <option>Primary 3</option>
                  <option>Primary 4</option>
                  <option>Primary 5</option>
                  <option>Primary 6</option>
                </optgroup>
                <optgroup label="Junior Secondary">
                  <option>JSS 1</option>
                  <option>JSS 2</option>
                  <option>JSS 3</option>
                </optgroup>
                <optgroup label="Senior Secondary">
                  <option>SS 1</option>
                  <option>SS 2</option>
                  <option>SS 3</option>
                </optgroup>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Date</label>
              <input class="form-input" type="date" id="attendDate">
            </div>
          </div>
          <button class="submit-btn" onclick="loadStudents()">Load Students →</button>
        </div>
        <div id="studentsContainer"></div>
      </div>
      <div id="historyTab" style="display:none;">
        <div class="card">
          <div class="card-title">Attendance History</div>
          <div class="filter-row">
            <select class="form-select" id="historyClass">
              <option value="">All Classes</option>
              <option>Nursery 1</option>
              <option>Nursery 2</option>
              <option>Nursery 3</option>
              <option>Primary 1</option>
              <option>Primary 2</option>
              <option>Primary 3</option>
              <option>Primary 4</option>
              <option>Primary 5</option>
              <option>Primary 6</option>
              <option>JSS 1</option>
              <option>JSS 2</option>
              <option>JSS 3</option>
              <option>SS 1</option>
              <option>SS 2</option>
              <option>SS 3</option>
            </select>
            <button class="filter-btn" onclick="loadHistory()">🔍 Filter</button>
          </div>
          <div id="historyContainer"><div class="loading-spinner">⏳ Loading...</div></div>
        </div>
      </div>
    `;
    // Set today's date
    document.getElementById('attendDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('attendDate').max = new Date().toISOString().split('T')[0];
  }

  function switchTab(tab, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('markTab').style.display = tab === 'mark' ? 'block' : 'none';
    document.getElementById('historyTab').style.display = tab === 'history' ? 'block' : 'none';
    if (tab === 'history') loadHistory();
  }

  async function loadStudents() {
    const className = document.getElementById('attendClass').value;
    const date = document.getElementById('attendDate').value;

    if (!className) {
      document.getElementById('markError').textContent = 'Please select a class!';
      document.getElementById('markError').style.display = 'block';
      return;
    }

    document.getElementById('markError').style.display = 'none';
    const container = document.getElementById('studentsContainer');
    container.innerHTML = '<div class="loading-spinner">⏳ Loading students...</div>';

    const students = await fetchData(`users?role=eq.student&class=eq.${encodeURIComponent(className)}&select=id,full_name,email`);

    if (!students || students.length === 0) {
      container.innerHTML = `
        <div class="card">
          <div class="empty-state">
            <div class="empty-state-icon">👥</div>
            <h3>No Students Found</h3>
            <p>No students registered for ${className} yet.</p>
          </div>
        </div>`;
      return;
    }

    attendanceMap = {};
    students.forEach(s => attendanceMap[s.id] = 'present');

    container.innerHTML = `
      <div class="card">
        <div class="card-title">📋 ${className} — ${formatDate(date)}</div>
        <div class="msg error" id="saveError"></div>
        <div class="msg success" id="saveSuccess"></div>
        <div class="student-list">
          ${students.map(s => `
            <div class="student-row">
              <div class="student-info">
                <div class="student-avatar">${s.full_name ? s.full_name[0].toUpperCase() : 'S'}</div>
                <div>
                  <div class="student-name">${s.full_name || 'Unknown'}</div>
                  <div class="student-email">${s.email}</div>
                </div>
              </div>
              <div class="status-btns">
                <button class="status-btn present selected" id="present_${s.id}" onclick="setStatus('${s.id}', 'present')">✅ Present</button>
                <button class="status-btn absent" id="absent_${s.id}" onclick="setStatus('${s.id}', 'absent')">❌ Absent</button>
                <button class="status-btn late" id="late_${s.id}" onclick="setStatus('${s.id}', 'late')">⏰ Late</button>
              </div>
            </div>
          `).join('')}
        </div>
        <button class="save-all-btn" onclick="saveAttendance('${className}', '${date}')">💾 Save Attendance for ${className}</button>
      </div>`;
  }

  function setStatus(studentId, status) {
    attendanceMap[studentId] = status;
    ['present', 'absent', 'late'].forEach(s => {
      const btn = document.getElementById(`${s}_${studentId}`);
      if (btn) btn.classList.remove('selected');
    });
    const activeBtn = document.getElementById(`${status}_${studentId}`);
    if (activeBtn) activeBtn.classList.add('selected');
  }

  async function saveAttendance(className, date) {
    const saveError = document.getElementById('saveError');
    const saveSuccess = document.getElementById('saveSuccess');
    saveError.style.display = 'none';
    saveSuccess.style.display = 'none';

    const records = Object.entries(attendanceMap).map(([studentId, status]) => ({
      student_id: studentId,
      date: date,
      status: status,
      class: className,
      teacher_id: currentUser.id
    }));

    if (records.length === 0) {
      saveError.textContent = 'No students to save!';
      saveError.style.display = 'block';
      return;
    }

   // Delete existing attendance for this class and date first
    await fetch(`${SUPABASE_URL}/rest/v1/attendance?class=eq.${encodeURIComponent(className)}&date=eq.${date}`, {
      method: 'DELETE',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Accept-Profile': 'public',
        'Content-Profile': 'public'
      }
    });

    const result = await postData('attendance', records);

    if (result && !result.error && !result.code) {
      saveSuccess.textContent = `✅ Attendance saved for ${records.length} students!`;
      saveSuccess.style.display = 'block';
    } else {
      saveError.textContent = 'Error: ' + JSON.stringify(result);
      saveError.style.display = 'block';
    }
  }

  async function loadHistory() {
    const container = document.getElementById('historyContainer');
    container.innerHTML = '<div class="loading-spinner">⏳ Loading...</div>';

    const className = document.getElementById('historyClass')?.value || '';
    let endpoint = `attendance?teacher_id=eq.${currentUser.id}&select=*,users!attendance_student_id_fkey(full_name)&order=date.desc&limit=100`;
    if (className) endpoint = `attendance?teacher_id=eq.${currentUser.id}&class=eq.${encodeURIComponent(className)}&select=*,users!attendance_student_id_fkey(full_name)&order=date.desc&limit=100`;

    const records = await fetchData(endpoint);

    if (!records || records.length === 0) {
      container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📅</div><h3>No Records Yet</h3><p>Mark attendance first to see history here.</p></div>`;
      return;
    }

    container.innerHTML = `
      <div style="overflow-x:auto;">
        <table class="attendance-table">
          <thead>
            <tr>
              <th>Student</th>
              <th>Date</th>
              <th>Class</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            ${records.map(r => `
              <tr>
                <td>${r.users?.full_name || 'Unknown'}</td>
                <td>${formatDate(r.date)}</td>
                <td>${r.class}</td>
                <td><span class="attendance-badge badge-${r.status}">${r.status === 'present' ? '✅ Present' : r.status === 'absent' ? '❌ Absent' : '⏰ Late'}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  }

  // ── STUDENT VIEW ──
  async function loadStudentView() {
    document.getElementById('mainContent').innerHTML = `
      <div class="page-header">
        <div class="page-label">My Attendance Record</div>
        <h1 class="page-title">📅 My Attendance</h1>
      </div>
      <div class="stats-row" id="attendStats">
        <div class="stat-card">
          <div class="stat-num" id="totalDays">-</div>
          <div class="stat-label">Total Days</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="presentDays" style="color:var(--accent3);">-</div>
          <div class="stat-label">Present</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="absentDays" style="color:#ef4444;">-</div>
          <div class="stat-label">Absent</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="lateDays" style="color:#fbbf24;">-</div>
          <div class="stat-label">Late</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="attendRate">-</div>
          <div class="stat-label">Rate</div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Attendance Record</div>
        <div id="studentAttendContainer"><div class="loading-spinner">⏳ Loading...</div></div>
      </div>
    `;
    loadStudentAttendance();
  }

  async function loadStudentAttendance() {
    const container = document.getElementById('studentAttendContainer');
    const records = await fetchData(`attendance?student_id=eq.${currentUser.id}&order=date.desc`);

    if (!records || records.length === 0) {
      container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📅</div><h3>No Records Yet</h3><p>Your attendance will appear here once your teacher marks it.</p></div>`;
      document.getElementById('totalDays').textContent = '0';
      document.getElementById('presentDays').textContent = '0';
      document.getElementById('absentDays').textContent = '0';
      document.getElementById('lateDays').textContent = '0';
      document.getElementById('attendRate').textContent = '0%';
      return;
    }

    const total = records.length;
    const present = records.filter(r => r.status === 'present').length;
    const absent = records.filter(r => r.status === 'absent').length;
    const late = records.filter(r => r.status === 'late').length;
    const rate = Math.round((present / total) * 100);

    document.getElementById('totalDays').textContent = total;
    document.getElementById('presentDays').textContent = present;
    document.getElementById('absentDays').textContent = absent;
    document.getElementById('lateDays').textContent = late;
    document.getElementById('attendRate').textContent = rate + '%';

    container.innerHTML = `
      <div style="overflow-x:auto;">
        <table class="attendance-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Class</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            ${records.map(r => `
              <tr>
                <td>${formatDate(r.date)}</td>
                <td>${r.class}</td>
                <td><span class="attendance-badge badge-${r.status}">${r.status === 'present' ? '✅ Present' : r.status === 'absent' ? '❌ Absent' : '⏰ Late'}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  }

  // ── ADMIN VIEW ──
  async function loadAdminView() {
    document.getElementById('mainContent').innerHTML = `
      <div class="page-header">
        <div class="page-label">Admin — Attendance Overview</div>
        <h1 class="page-title">📅 All Attendance</h1>
      </div>
      <div class="card">
        <div class="card-title">Attendance Records</div>
        <div class="filter-row">
          <select class="form-select" id="adminClass">
            <option value="">All Classes</option>
            <option>JSS 1</option><option>JSS 2</option><option>JSS 3</option>
            <option>SS 1</option><option>SS 2</option><option>SS 3</option>
          </select>
          <input class="form-input" type="date" id="adminDate" style="flex:1; min-width:140px;">
          <button class="filter-btn" onclick="loadAdminAttendance()">🔍 Filter</button>
        </div>
        <div id="adminAttendContainer"><div class="loading-spinner">⏳ Loading...</div></div>
      </div>
    `;
    loadAdminAttendance();
  }

  async function loadAdminAttendance() {
    const container = document.getElementById('adminAttendContainer');
    container.innerHTML = '<div class="loading-spinner">⏳ Loading...</div>';

    const className = document.getElementById('adminClass')?.value || '';
    const date = document.getElementById('adminDate')?.value || '';

    let endpoint = `attendance?select=*,users!attendance_student_id_fkey(full_name,email)&order=date.desc&limit=200`;
    if (className) endpoint += `&class=eq.${encodeURIComponent(className)}`;
    if (date) endpoint += `&date=eq.${date}`;

    const records = await fetchData(endpoint);

    if (!records || records.length === 0) {
      container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📅</div><h3>No Records</h3><p>No attendance records found.</p></div>`;
      return;
    }

    container.innerHTML = `
      <div style="overflow-x:auto;">
        <table class="attendance-table">
          <thead>
            <tr>
              <th>Student</th>
              <th>Date</th>
              <th>Class</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            ${records.map(r => `
              <tr>
                <td>${r.users?.full_name || 'Unknown'}</td>
                <td>${formatDate(r.date)}</td>
                <td>${r.class}</td>
                <td><span class="attendance-badge badge-${r.status}">${r.status === 'present' ? '✅ Present' : r.status === 'absent' ? '❌ Absent' : '⏰ Late'}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  }

  function logout() {
    localStorage.removeItem('ccs_token');
    localStorage.removeItem('ccs_user');
    window.location.href = 'portal.html';
  }

  window.addEventListener('load', () => {
    token = localStorage.getItem('ccs_token');
    const userStr = localStorage.getItem('ccs_user');

    if (!token || !userStr) {
      window.location.href = 'portal.html';
      return;
    }

    currentUser = JSON.parse(userStr);
    document.getElementById('navUser').textContent = currentUser.full_name || currentUser.email;

    if (currentUser.role === 'teacher') {
      loadTeacherView();
    } else if (currentUser.role === 'student') {
      loadStudentView();
    } else if (currentUser.role === 'admin') {
      loadAdminView();
    }
  });
</script>
</body>
</html>

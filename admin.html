<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrystalHub | Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070b12;
      --surface: #0d1321;
      --card: #111827;
      --accent: #00d4ff;
      --accent2: #7c3aed;
      --accent3: #10b981;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #1e293b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    nav { padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; background: rgba(8,12,20,0.95); border-bottom: 1px solid rgba(0,212,255,0.08); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 99; }
    .nav-logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.1rem; color: var(--accent); text-decoration: none; }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-user { font-size: 0.83rem; color: var(--muted); }
    .nav-back { color: var(--muted); text-decoration: none; font-size: 0.83rem; }
    .logout-btn { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: #ef4444; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 0.78rem; font-weight: 600; }
    .main { max-width: 1000px; margin: 0 auto; padding: 32px 20px; }
    .page-header { margin-bottom: 32px; }
    .page-label { font-size: 0.72rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.15em; font-weight: 600; margin-bottom: 8px; }
    .page-title { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 800; letter-spacing: -0.02em; }
    .tabs { display: flex; gap: 8px; margin-bottom: 28px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 6px; flex-wrap: wrap; }
    .tab { flex: 1; padding: 10px; text-align: center; border-radius: 8px; cursor: pointer; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.82rem; color: var(--muted); transition: all 0.2s; border: none; background: none; min-width: 100px; }
    .tab.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #000; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; text-align: center; position: relative; overflow: hidden; }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
    .sc-blue::before { background: linear-gradient(90deg, var(--accent), #0099cc); }
    .sc-purple::before { background: linear-gradient(90deg, var(--accent2), #9333ea); }
    .sc-green::before { background: linear-gradient(90deg, var(--accent3), #059669); }
    .sc-orange::before { background: linear-gradient(90deg, #f97316, #ea580c); }
    .stat-num { font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 800; color: var(--accent); }
    .stat-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
    .card-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem; margin-bottom: 20px; color: var(--accent); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .filter-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-row .form-select, .filter-row .form-input { flex: 1; min-width: 140px; }
    .form-select, .form-input { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.88rem; outline: none; transition: border-color 0.2s; }
    .form-select:focus, .form-input:focus { border-color: rgba(0,212,255,0.4); }
    .form-select option { background: var(--card); }
    .filter-btn { background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.2); color: var(--accent); padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.85rem; white-space: nowrap; }
    .users-table { width: 100%; border-collapse: collapse; }
    .users-table th { text-align: left; padding: 12px 16px; font-size: 0.72rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; border-bottom: 1px solid var(--border); font-family: 'Syne', sans-serif; }
    .users-table td { padding: 14px 16px; font-size: 0.85rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .users-table tr:last-child td { border-bottom: none; }
    .users-table tr:hover td { background: rgba(0,212,255,0.02); }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .user-avatar-sm { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 0.78rem; color: #000; flex-shrink: 0; }
    .user-name-cell { font-weight: 600; font-size: 0.88rem; }
    .user-email-cell { color: var(--muted); font-size: 0.75rem; }
    .role-badge { display: inline-block; padding: 3px 10px; border-radius: 100px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .role-student { background: rgba(0,212,255,0.1); color: var(--accent); border: 1px solid rgba(0,212,255,0.2); }
    .role-teacher { background: rgba(124,58,237,0.1); color: #a78bfa; border: 1px solid rgba(124,58,237,0.2); }
    .role-admin { background: rgba(16,185,129,0.1); color: var(--accent3); border: 1px solid rgba(16,185,129,0.2); }
    .action-btn { padding: 5px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; font-family: 'Syne', sans-serif; }
    .btn-danger { background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }
    .btn-danger:hover { background: rgba(239,68,68,0.2); }
    .btn-edit { background: rgba(0,212,255,0.1); color: var(--accent); border: 1px solid rgba(0,212,255,0.2); }
    .btn-edit:hover { background: rgba(0,212,255,0.2); }
    .btn-promote { background: rgba(16,185,129,0.1); color: var(--accent3); border: 1px solid rgba(16,185,129,0.2); }
    .btn-promote:hover { background: rgba(16,185,129,0.2); }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
    .empty-state-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state h3 { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem; color: var(--text); margin-bottom: 8px; }
    .loading-spinner { text-align: center; padding: 40px; color: var(--muted); font-size: 1.1rem; }
    .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
    .search-box .form-input { flex: 1; }
    .badge-count { background: var(--accent); color: #000; font-size: 0.7rem; font-weight: 800; padding: 2px 7px; border-radius: 100px; font-family: 'Syne', sans-serif; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 999; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 28px; max-width: 440px; width: 100%; position: relative; }
    .modal-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.1rem; margin-bottom: 20px; }
    .modal-close { position: absolute; top: 16px; right: 16px; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: #ef4444; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
    .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .form-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }
    .modal-btn { width: 100%; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #000; padding: 12px; border: none; border-radius: 10px; font-weight: 700; font-size: 0.9rem; cursor: pointer; font-family: 'Syne', sans-serif; margin-top: 8px; }
    .msg { padding: 10px 14px; border-radius: 8px; font-size: 0.83rem; margin-bottom: 14px; display: none; }
    .msg.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: #ef4444; }
    .msg.success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.2); color: var(--accent3); }
    .announce-textarea { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.9rem; outline: none; width: 100%; height: 120px; resize: none; }
    .announce-textarea:focus { border-color: rgba(0,212,255,0.4); }
    @media (max-width: 600px) {
      .users-table th:nth-child(3), .users-table td:nth-child(3),
      .users-table th:nth-child(4), .users-table td:nth-child(4) { display: none; }
    }
  </style>
</head>
<body>

<nav>
  <a href="portal.html" class="nav-logo">✨ CrystalHub</a>
  <div class="nav-right">
    <span class="nav-user" id="navUser"></span>
    <a href="portal.html" class="nav-back">← Dashboard</a>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</nav>

<!-- EDIT USER MODAL -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeEditModal()">✕</button>
    <div class="modal-title">✏️ Edit User</div>
    <div class="msg error" id="editError"></div>
    <div class="msg success" id="editSuccess"></div>
    <input type="hidden" id="editUserId">
    <div class="form-group">
      <label class="form-label">Full Name</label>
      <input class="form-input" type="text" id="editName" placeholder="Full name">
    </div>
    <div class="form-group">
      <label class="form-label">Role</label>
      <select class="form-select" id="editRole">
        <option value="student">Student</option>
        <option value="teacher">Teacher</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Class / Subject</label>
      <input class="form-input" type="text" id="editClass" placeholder="e.g. JSS 2A or Mathematics">
    </div>
    <div class="form-group">
      <label class="form-label">Phone</label>
      <input class="form-input" type="tel" id="editPhone" placeholder="+234 xxx xxx xxxx">
    </div>
    <button class="modal-btn" onclick="saveUserEdit()">Save Changes →</button>
  </div>
</div>

<div class="main" id="mainContent">
  <div class="loading-spinner">⏳ Loading Admin Panel...</div>
</div>

<script>
  const SUPABASE_URL = 'https://cyeretlyfxmponybizrm.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5ZXJldGx5ZnhtcG9ueWJpenJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MjIzNzUsImV4cCI6MjA5NTE5ODM3NX0.pVmmH34yJB74UjfWwVwT0odyP5_6Y0qgsp-Hq3Pqutg';

  let currentUser = null;
  let token = null;
  let allUsers = [];

  async function fetchData(endpoint) {
    const authToken = localStorage.getItem('ccs_token') || token;
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${authToken}`,
        'Content-Type': 'application/json',
        'Accept-Profile': 'public'
      }
    });
    return res.json();
  }

  async function patchData(endpoint, body) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, {
      method: 'PATCH',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation',
        'Accept-Profile': 'public',
        'Content-Profile': 'public'
      },
      body: JSON.stringify(body)
    });
    return res.json();
  }

  async function deleteData(endpoint) {
    return fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, {
      method: 'DELETE',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Accept-Profile': 'public',
        'Content-Profile': 'public'
      }
    });
  }

  function getInitials(name, email) {
    if (name && name.trim()) return name.trim().split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
    return email ? email[0].toUpperCase() : 'U';
  }

  // ── LOAD ADMIN PANEL ──
  async function loadAdminPanel() {
    document.getElementById('mainContent').innerHTML = `
      <div class="page-header">
        <div class="page-label">Admin Control Panel</div>
        <h1 class="page-title">👨‍💼 Admin Panel</h1>
      </div>

      <!-- STATS -->
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card sc-blue">
          <div class="stat-num" id="totalUsers">-</div>
          <div class="stat-label">Total Users</div>
        </div>
        <div class="stat-card sc-purple">
          <div class="stat-num" id="totalStudents">-</div>
          <div class="stat-label">Students</div>
        </div>
        <div class="stat-card sc-green">
          <div class="stat-num" id="totalTeachers">-</div>
          <div class="stat-label">Teachers</div>
        </div>
        <div class="stat-card sc-orange">
          <div class="stat-num" id="totalResults">-</div>
          <div class="stat-label">Results</div>
        </div>
      </div>

      <!-- TABS -->
      <div class="tabs">
        <button class="tab active" onclick="switchTab('users', this)">👥 All Users</button>
        <button class="tab" onclick="switchTab('students', this)">👨‍🎓 Students</button>
        <button class="tab" onclick="switchTab('teachers', this)">👨‍🏫 Teachers</button>
        <button class="tab" onclick="switchTab('announce', this)">📢 Announce</button>
      </div>

      <div id="usersTab">
        <div class="card">
          <div class="card-title">
            All Users
            <span class="badge-count" id="userCount">0</span>
          </div>
          <div class="search-box">
            <input class="form-input" type="text" id="searchInput" placeholder="🔍 Search by name or email..." oninput="filterUsers()">
            <select class="form-select" id="roleFilter" onchange="filterUsers()" style="max-width:140px;">
              <option value="">All Roles</option>
              <option value="student">Students</option>
              <option value="teacher">Teachers</option>
              <option value="admin">Admins</option>
            </select>
          </div>
          <div style="overflow-x:auto;">
            <table class="users-table" id="usersTable">
              <thead>
                <tr>
                  <th>User</th>
                  <th>Role</th>
                  <th>Class/Subject</th>
                  <th>Phone</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="usersTableBody">
                <tr><td colspan="5" style="text-align:center; padding:40px; color:var(--muted);">⏳ Loading users...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div id="studentsTab" style="display:none;">
        <div class="card">
          <div class="card-title">Students by Class</div>
          <div class="filter-row">
            <select class="form-select" id="classFilter">
              <option value="">All Classes</option>
              <optgroup label="Nursery">
                <option>Nursery 1</option><option>Nursery 2</option><option>Nursery 3</option>
              </optgroup>
              <optgroup label="Primary">
                <option>Primary 1</option><option>Primary 2</option><option>Primary 3</option>
                <option>Primary 4</option><option>Primary 5</option><option>Primary 6</option>
              </optgroup>
              <optgroup label="Junior Secondary">
                <option>JSS 1</option><option>JSS 2</option><option>JSS 3</option>
              </optgroup>
              <optgroup label="Senior Secondary">
                <option>SS 1</option><option>SS 2</option><option>SS 3</option>
              </optgroup>
            </select>
            <button class="filter-btn" onclick="loadStudentsByClass()">🔍 Filter</button>
          </div>
          <div id="studentsContainer"><div class="loading-spinner">⏳ Loading...</div></div>
        </div>
      </div>

      <div id="teachersTab" style="display:none;">
        <div class="card">
          <div class="card-title">All Teachers</div>
          <div id="teachersContainer"><div class="loading-spinner">⏳ Loading...</div></div>
        </div>
      </div>

      <div id="announceTab" style="display:none;">
        <div class="card">
          <div class="card-title">📢 Send Announcement</div>
          <div class="msg error" id="announceError"></div>
          <div class="msg success" id="announceSuccess"></div>
          <div class="form-group">
            <label class="form-label">Announcement Title</label>
            <input class="form-input" type="text" id="announceTitle" placeholder="e.g. School Closure Notice">
          </div>
          <div class="form-group">
            <label class="form-label">Message</label>
            <textarea class="announce-textarea" id="announceMsg" placeholder="Type your announcement here..."></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Target Audience</label>
            <select class="form-select" id="announceTarget">
              <option value="all">Everyone</option>
              <option value="student">Students Only</option>
              <option value="teacher">Teachers Only</option>
            </select>
          </div>
          <button class="modal-btn" onclick="sendAnnouncement()">Send Announcement →</button>
        </div>

        <div class="card">
          <div class="card-title">📋 Quick Stats</div>
          <div class="stats-grid">
            <div class="stat-card sc-blue">
              <div class="stat-num" id="totalAssignments">-</div>
              <div class="stat-label">Assignments</div>
            </div>
            <div class="stat-card sc-purple">
              <div class="stat-num" id="totalAttendance">-</div>
              <div class="stat-label">Attendance Records</div>
            </div>
            <div class="stat-card sc-green">
              <div class="stat-num" id="totalNotes">-</div>
              <div class="stat-label">Lesson Notes</div>
            </div>
          </div>
        </div>
      </div>
    `;

    loadAllStats();
    loadAllUsers();
  }

  function switchTab(tab, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    ['usersTab', 'studentsTab', 'teachersTab', 'announceTab'].forEach(t => {
      document.getElementById(t).style.display = 'none';
    });
    document.getElementById(`${tab}Tab`).style.display = 'block';
    if (tab === 'students') loadStudentsByClass();
    if (tab === 'teachers') loadTeachers();
    if (tab === 'announce') loadQuickStats();
  }

  async function loadAllStats() {
    const [users, results] = await Promise.all([
      fetchData('users?select=id,role'),
      fetchData('results?select=id')
    ]);

    if (Array.isArray(users)) {
      const students = users.filter(u => u.role === 'student').length;
      const teachers = users.filter(u => u.role === 'teacher').length;
      document.getElementById('totalUsers').textContent = users.length;
      document.getElementById('totalStudents').textContent = students;
      document.getElementById('totalTeachers').textContent = teachers;
    }

    if (Array.isArray(results)) {
      document.getElementById('totalResults').textContent = results.length;
    }
  }

  async function loadAllUsers() {
    const users = await fetchData('users?order=created_at.desc&select=*');
    if (!Array.isArray(users)) return;
    allUsers = users;
    document.getElementById('userCount').textContent = users.length;
    renderUsersTable(users);
  }

  function renderUsersTable(users) {
    const tbody = document.getElementById('usersTableBody');
    if (!users || users.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><div class="empty-state-icon">👥</div><h3>No Users Found</h3></div></td></tr>`;
      return;
    }

    tbody.innerHTML = users.map(u => `
      <tr>
        <td>
          <div class="user-info">
            <div class="user-avatar-sm">${getInitials(u.full_name, u.email)}</div>
            <div>
              <div class="user-name-cell">${u.full_name || 'No Name'}</div>
              <div class="user-email-cell">${u.email}</div>
            </div>
          </div>
        </td>
        <td><span class="role-badge role-${u.role}">${u.role}</span></td>
        <td>${u.class || u.subject || '—'}</td>
        <td>${u.phone || '—'}</td>
        <td>
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            <button class="action-btn btn-edit" onclick="openEditModal('${u.id}')">✏️ Edit</button>
            <button class="action-btn btn-danger" onclick="deleteUser('${u.id}', '${u.full_name || u.email}')">🗑️</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  function filterUsers() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const role = document.getElementById('roleFilter').value;
    const filtered = allUsers.filter(u => {
      const matchSearch = !search ||
        (u.full_name && u.full_name.toLowerCase().includes(search)) ||
        (u.email && u.email.toLowerCase().includes(search));
      const matchRole = !role || u.role === role;
      return matchSearch && matchRole;
    });
    document.getElementById('userCount').textContent = filtered.length;
    renderUsersTable(filtered);
  }

  function openEditModal(userId) {
    const user = allUsers.find(u => u.id === userId);
    if (!user) return;
    document.getElementById('editUserId').value = userId;
    document.getElementById('editName').value = user.full_name || '';
    document.getElementById('editRole').value = user.role || 'student';
    document.getElementById('editClass').value = user.class || user.subject || '';
    document.getElementById('editPhone').value = user.phone || '';
    document.getElementById('editError').style.display = 'none';
    document.getElementById('editSuccess').style.display = 'none';
    document.getElementById('editModal').classList.add('open');
  }

  function closeEditModal() {
    document.getElementById('editModal').classList.remove('open');
  }

  async function saveUserEdit() {
    const id = document.getElementById('editUserId').value;
    const full_name = document.getElementById('editName').value.trim();
    const role = document.getElementById('editRole').value;
    const classVal = document.getElementById('editClass').value.trim();
    const phone = document.getElementById('editPhone').value.trim();

    const errorEl = document.getElementById('editError');
    const successEl = document.getElementById('editSuccess');
    errorEl.style.display = 'none';
    successEl.style.display = 'none';

    if (!full_name) { errorEl.textContent = 'Name is required!'; errorEl.style.display = 'block'; return; }

    const result = await patchData(`users?id=eq.${id}`, { full_name, role, class: classVal, phone });

    if (Array.isArray(result) || (result && !result.error)) {
      successEl.textContent = '✅ User updated successfully!';
      successEl.style.display = 'block';
      await loadAllUsers();
      setTimeout(closeEditModal, 1500);
    } else {
      errorEl.textContent = 'Error: ' + JSON.stringify(result);
      errorEl.style.display = 'block';
    }
  }

  async function deleteUser(id, name) {
    if (!confirm(`Delete user "${name}"? This cannot be undone!`)) return;
    await deleteData(`users?id=eq.${id}`);
    await loadAllUsers();
    await loadAllStats();
  }

  async function loadStudentsByClass() {
    const container = document.getElementById('studentsContainer');
    container.innerHTML = '<div class="loading-spinner">⏳ Loading...</div>';
    const className = document.getElementById('classFilter')?.value || '';
    let endpoint = `users?role=eq.student&order=full_name.asc`;
    if (className) endpoint += `&class=eq.${encodeURIComponent(className)}`;
    const students = await fetchData(endpoint);

    if (!students || students.length === 0) {
      container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">👨‍🎓</div><h3>No Students Found</h3><p>No students registered${className ? ` for ${className}` : ''} yet.</p></div>`;
      return;
    }

    container.innerHTML = `
      <div style="overflow-x:auto;">
        <table class="users-table">
          <thead><tr><th>Student</th><th>Class</th><th>Phone</th><th>Actions</th></tr></thead>
          <tbody>
            ${students.map(s => `
              <tr>
                <td>
                  <div class="user-info">
                    <div class="user-avatar-sm">${getInitials(s.full_name, s.email)}</div>
                    <div>
                      <div class="user-name-cell">${s.full_name || 'No Name'}</div>
                      <div class="user-email-cell">${s.email}</div>
                    </div>
                  </div>
                </td>
                <td>${s.class || '—'}</td>
                <td>${s.phone || '—'}</td>
                <td>
                  <button class="action-btn btn-edit" onclick="openEditModal('${s.id}')">✏️ Edit</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  }

  async function loadTeachers() {
    const container = document.getElementById('teachersContainer');
    container.innerHTML = '<div class="loading-spinner">⏳ Loading...</div>';
    const teachers = await fetchData('users?role=eq.teacher&order=full_name.asc');

    if (!teachers || teachers.length === 0) {
      container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">👨‍🏫</div><h3>No Teachers Yet</h3><p>No teachers have registered yet.</p></div>`;
      return;
    }

    container.innerHTML = `
      <div style="overflow-x:auto;">
        <table class="users-table">
          <thead><tr><th>Teacher</th><th>Subject</th><th>Phone</th><th>Actions</th></tr></thead>
          <tbody>
            ${teachers.map(t => `
              <tr>
                <td>
                  <div class="user-info">
                    <div class="user-avatar-sm" style="background:linear-gradient(135deg,var(--accent2),#9333ea);">${getInitials(t.full_name, t.email)}</div>
                    <div>
                      <div class="user-name-cell">${t.full_name || 'No Name'}</div>
                      <div class="user-email-cell">${t.email}</div>
                    </div>
                  </div>
                </td>
                <td>${t.class || t.subject || '—'}</td>
                <td>${t.phone || '—'}</td>
                <td>
                  <button class="action-btn btn-edit" onclick="openEditModal('${t.id}')">✏️ Edit</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  }

  async function loadQuickStats() {
    const [assignments, attendance, notes] = await Promise.all([
      fetchData('assignments?select=id'),
      fetchData('attendance?select=id'),
      fetchData('lesson_notes?select=id')
    ]);
    if (Array.isArray(assignments)) document.getElementById('totalAssignments').textContent = assignments.length;
    if (Array.isArray(attendance)) document.getElementById('totalAttendance').textContent = attendance.length;
    if (Array.isArray(notes)) document.getElementById('totalNotes').textContent = notes.length;
  }

  function sendAnnouncement() {
    const title = document.getElementById('announceTitle').value.trim();
    const msg = document.getElementById('announceMsg').value.trim();
    const target = document.getElementById('announceTarget').value;
    const errorEl = document.getElementById('announceError');
    const successEl = document.getElementById('announceSuccess');
    errorEl.style.display = 'none';
    successEl.style.display = 'none';

    if (!title || !msg) {
      errorEl.textContent = 'Please fill in title and message!';
      errorEl.style.display = 'block';
      return;
    }

    successEl.textContent = `✅ Announcement "${title}" sent to ${target === 'all' ? 'everyone' : target + 's'}!`;
    successEl.style.display = 'block';
    document.getElementById('announceTitle').value = '';
    document.getElementById('announceMsg').value = '';
  }

  function logout() {
    localStorage.removeItem('ccs_token');
    localStorage.removeItem('ccs_user');
    window.location.href = 'portal.html';
  }

  window.addEventListener('load', () => {
    token = localStorage.getItem('ccs_token');
    const userStr = localStorage.getItem('ccs_user');
    if (!token || !userStr) { window.location.href = 'portal.html'; return; }
    currentUser = JSON.parse(userStr);
    if (currentUser.role !== 'admin') {
      window.location.href = 'portal.html';
      return;
    }
    document.getElementById('navUser').textContent = currentUser.full_name || currentUser.email;
    loadAdminPanel();
  });
</script>
</body>
</html>

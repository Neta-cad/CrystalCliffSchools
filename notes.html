<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrystalHub | Lesson Notes</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070b12;
      --surface: #0d1321;
      --card: #111827;
      --accent: #00d4ff;
      --accent2: #7c3aed;
      --accent3: #10b981;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #1e293b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    nav { padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; background: rgba(8,12,20,0.95); border-bottom: 1px solid rgba(0,212,255,0.08); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 99; }
    .nav-logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.1rem; color: var(--accent); text-decoration: none; }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-user { font-size: 0.83rem; color: var(--muted); }
    .nav-back { color: var(--muted); text-decoration: none; font-size: 0.83rem; }
    .nav-back:hover { color: var(--accent); }
    .logout-btn { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: #ef4444; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 0.78rem; font-weight: 600; }
    .main { max-width: 900px; margin: 0 auto; padding: 32px 20px; }
    .page-header { margin-bottom: 32px; }
    .page-label { font-size: 0.72rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.15em; font-weight: 600; margin-bottom: 8px; }
    .page-title { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 800; letter-spacing: -0.02em; }
    .tabs { display: flex; gap: 8px; margin-bottom: 28px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 6px; }
    .tab { flex: 1; padding: 10px; text-align: center; border-radius: 8px; cursor: pointer; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.85rem; color: var(--muted); transition: all 0.2s; border: none; background: none; }
    .tab.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #000; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
    .card-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem; margin-bottom: 20px; color: var(--accent); }
    .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .form-group.full { grid-column: 1/-1; }
    .form-label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }
    .form-input, .form-select, .form-textarea { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.9rem; outline: none; transition: border-color 0.2s; width: 100%; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: rgba(0,212,255,0.4); }
    .form-select option { background: var(--card); }
    .form-textarea { height: 200px; resize: vertical; line-height: 1.7; }
    .submit-btn { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #000; padding: 12px 28px; border: none; border-radius: 10px; font-weight: 700; font-size: 0.9rem; cursor: pointer; font-family: 'Syne', sans-serif; transition: transform 0.2s; box-shadow: 0 0 20px rgba(0,212,255,0.2); }
    .submit-btn:hover { transform: translateY(-2px); }
    .msg { padding: 12px 16px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 16px; display: none; }
    .msg.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: #ef4444; }
    .msg.success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.2); color: var(--accent3); }
    .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .note-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; transition: all 0.2s; cursor: pointer; position: relative; overflow: hidden; }
    .note-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
    .note-card:hover { transform: translateY(-4px); border-color: rgba(0,212,255,0.2); box-shadow: 0 12px 30px rgba(0,0,0,0.3); }
    .note-subject { display: inline-block; background: rgba(0,212,255,0.1); color: var(--accent); border: 1px solid rgba(0,212,255,0.2); padding: 3px 10px; border-radius: 100px; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
    .note-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1rem; margin-bottom: 8px; line-height: 1.3; }
    .note-preview { color: var(--muted); font-size: 0.83rem; line-height: 1.6; margin-bottom: 16px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .note-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--muted); }
    .note-class { background: rgba(124,58,237,0.1); color: #a78bfa; border: 1px solid rgba(124,58,237,0.2); padding: 3px 8px; border-radius: 6px; font-weight: 600; }
    .note-actions { display: flex; gap: 8px; margin-top: 12px; }
    .action-btn { padding: 6px 14px; border-radius: 8px; font-size: 0.78rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; font-family: 'Syne', sans-serif; }
    .action-btn.view { background: rgba(0,212,255,0.1); color: var(--accent); border: 1px solid rgba(0,212,255,0.2); }
    .action-btn.view:hover { background: rgba(0,212,255,0.2); }
    .action-btn.delete { background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }
    .action-btn.delete:hover { background: rgba(239,68,68,0.2); }
    .note-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 999; display: none; align-items: center; justify-content: center; padding: 20px; }
    .note-modal.open { display: flex; }
    .note-modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 32px; max-width: 680px; width: 100%; max-height: 85vh; overflow-y: auto; position: relative; }
    .note-modal-close { position: absolute; top: 16px; right: 16px; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: #ef4444; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; }
    .note-modal-subject { display: inline-block; background: rgba(0,212,255,0.1); color: var(--accent); border: 1px solid rgba(0,212,255,0.2); padding: 4px 12px; border-radius: 100px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; margin-bottom: 12px; }
    .note-modal-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.4rem; margin-bottom: 16px; line-height: 1.3; }
    .note-modal-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    .note-modal-body { color: var(--muted); font-size: 0.92rem; line-height: 1.9; white-space: pre-wrap; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state-icon { font-size: 3.5rem; margin-bottom: 16px; }
    .empty-state h3 { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.1rem; color: var(--text); margin-bottom: 8px; }
    .loading-spinner { text-align: center; padding: 40px; color: var(--muted); }
    .filter-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-row .form-select { flex: 1; min-width: 140px; }
    .filter-btn { background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.2); color: var(--accent); padding: 11px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.85rem; white-space: nowrap; }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } .notes-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<nav>
  <a href="portal.html" class="nav-logo">✨ CrystalHub</a>
  <div class="nav-right">
    <span class="nav-user" id="navUser"></span>
    <a href="portal.html" class="nav-back">← Dashboard</a>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</nav>

<!-- NOTE VIEWER MODAL -->
<div class="note-modal" id="noteModal">
  <div class="note-modal-content">
    <button class="note-modal-close" onclick="closeModal()">✕</button>
    <div class="note-modal-subject" id="modalSubject"></div>
    <div class="note-modal-title" id="modalTitle"></div>
    <div class="note-modal-meta" id="modalMeta"></div>
    <div class="note-modal-body" id="modalBody"></div>
  </div>
</div>

<div class="main" id="mainContent">
  <div class="loading-spinner">⏳ Loading...</div>
</div>

<script>
  const SUPABASE_URL = 'https://cyeretlyfxmponybizrm.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5ZXJldGx5ZnhtcG9ueWJpenJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MjIzNzUsImV4cCI6MjA5NTE5ODM3NX0.pVmmH34yJB74UjfWwVwT0odyP5_6Y0qgsp-Hq3Pqutg';

  let currentUser = null;
  let token = null;

  async function fetchData(endpoint) {
    const authToken = localStorage.getItem('ccs_token') || token;
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${authToken}`,
        'Content-Type': 'application/json',
        'Accept-Profile': 'public'
      }
    });
    return res.json();
  }

  async function postData(body) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/lesson_notes`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation',
        'Accept-Profile': 'public',
        'Content-Profile': 'public'
      },
      body: JSON.stringify(body)
    });
    return res.json();
  }

  function formatDate(dateStr) {
    return new Date(dateStr).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function openModal(note) {
    document.getElementById('modalSubject').textContent = note.subject;
    document.getElementById('modalTitle').textContent = note.title;
    document.getElementById('modalMeta').innerHTML = `
      <span>👥 ${note.class}</span>
      <span>📅 ${formatDate(note.created_at)}</span>
    `;
    document.getElementById('modalBody').textContent = note.content;
    document.getElementById('noteModal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('noteModal').classList.remove('open');
    document.body.style.overflow = '';
  }

  // ── TEACHER VIEW ──
  function loadTeacherView() {
    document.getElementById('mainContent').innerHTML = `
      <div class="page-header">
        <div class="page-label">Lesson Notes Management</div>
        <h1 class="page-title">📚 Lesson Notes</h1>
      </div>
      <div class="tabs">
        <button class="tab active" onclick="switchTab('create', this)">✍️ Create Note</button>
        <button class="tab" onclick="switchTab('manage', this)">📋 My Notes</button>
      </div>
      <div id="createTab">
        <div class="card">
          <div class="card-title">Create New Lesson Note</div>
          <div class="msg error" id="createError"></div>
          <div class="msg success" id="createSuccess"></div>
          <div class="form-grid">
            <div class="form-group full">
              <label class="form-label">Note Title</label>
              <input class="form-input" type="text" id="noteTitle" placeholder="e.g. Introduction to Quadratic Equations">
            </div>
            <div class="form-group">
              <label class="form-label">Subject</label>
              <select class="form-select" id="noteSubject">
                <option value="">Select Subject</option>
                <optgroup label="🍼 NURSERY">
                  <option>Number Work</option>
                  <option>Letter Work / Phonics</option>
                  <option>Oral English</option>
                  <option>Creative Arts - Nursery</option>
                </optgroup>
                <optgroup label="📚 PRIMARY">
                  <option>English Studies</option>
                  <option>Mathematics - Primary</option>
                  <option>Basic Science and Technology</option>
                  <option>Social Studies - Primary</option>
                  <option>Computer Studies / ICT - Primary</option>
                  <option>Verbal Reasoning</option>
                  <option>Quantitative Reasoning</option>
                </optgroup>
                <optgroup label="🎒 JSS">
                  <option>English Language - JSS</option>
                  <option>Mathematics - JSS</option>
                  <option>Basic Science - JSS</option>
                  <option>Basic Technology</option>
                  <option>Social Studies - JSS</option>
                  <option>Computer Studies / ICT - JSS</option>
                  <option>Business Studies</option>
                </optgroup>
                <optgroup label="🎓 SSS CORE">
                  <option>English Language</option>
                  <option>Mathematics</option>
                  <option>Civic Education</option>
                </optgroup>
                <optgroup label="🔬 SSS SCIENCE">
                  <option>Physics</option>
                  <option>Chemistry</option>
                  <option>Biology</option>
                  <option>Further Mathematics</option>
                  <option>Agricultural Science</option>
                </optgroup>
                <optgroup label="📊 SSS COMMERCIAL">
                  <option>Accounting</option>
                  <option>Commerce</option>
                  <option>Economics</option>
                </optgroup>
                <optgroup label="🎨 SSS ARTS">
                  <option>Literature-in-English</option>
                  <option>Government</option>
                  <option>History</option>
                  <option>Fine Arts</option>
                </optgroup>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Class</label>
              <select class="form-select" id="noteClass">
                <option value="">Select Class</option>
                <optgroup label="Nursery">
                  <option>Nursery 1</option>
                  <option>Nursery 2</option>
                  <option>Nursery 3</option>
                </optgroup>
                <optgroup label="Primary">
                  <option>Primary 1</option>
                  <option>Primary 2</option>
                  <option>Primary 3</option>
                  <option>Primary 4</option>
                  <option>Primary 5</option>
                  <option>Primary 6</option>
                </optgroup>
                <optgroup label="Junior Secondary">
                  <option>JSS 1</option>
                  <option>JSS 2</option>
                  <option>JSS 3</option>
                </optgroup>
                <optgroup label="Senior Secondary">
                  <option>SS 1</option>
                  <option>SS 2</option>
                  <option>SS 3</option>
                </optgroup>
              </select>
            </div>
            <div class="form-group full">
              <label class="form-label">Note Content</label>
              <textarea class="form-textarea" id="noteContent" placeholder="Type your lesson note here...

You can include:
- Topic introduction
- Key concepts
- Examples
- Practice questions
- Summary"></textarea>
            </div>
          </div>
          <button class="submit-btn" onclick="createNote()">Publish Note →</button>
        </div>
      </div>
      <div id="manageTab" style="display:none;">
        <div id="myNotesContainer"><div class="loading-spinner">⏳ Loading...</div></div>
      </div>
    `;
  }

  function switchTab(tab, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('createTab').style.display = tab === 'create' ? 'block' : 'none';
    document.getElementById('manageTab').style.display = tab === 'manage' ? 'block' : 'none';
    if (tab === 'manage') loadMyNotes();
  }

  async function createNote() {
    const title = document.getElementById('noteTitle').value.trim();
    const subject = document.getElementById('noteSubject').value;
    const className = document.getElementById('noteClass').value;
    const content = document.getElementById('noteContent').value.trim();

    const errorEl = document.getElementById('createError');
    const successEl = document.getElementById('createSuccess');
    errorEl.style.display = 'none';
    successEl.style.display = 'none';

    if (!title || !subject || !className || !content) {
      errorEl.textContent = 'Please fill in all fields!';
      errorEl.style.display = 'block';
      return;
    }

    const result = await postData({
      title,
      subject,
      class: className,
      content,
      teacher_id: currentUser.id
    });

    if (result && !result.error && !result.code) {
      successEl.textContent = '✅ Lesson note published successfully!';
      successEl.style.display = 'block';
      document.getElementById('noteTitle').value = '';
      document.getElementById('noteSubject').value = '';
      document.getElementById('noteClass').value = '';
      document.getElementById('noteContent').value = '';
    } else {
      errorEl.textContent = 'Error: ' + JSON.stringify(result);
      errorEl.style.display = 'block';
    }
  }

  async function loadMyNotes() {
    const container = document.getElementById('myNotesContainer');
    container.innerHTML = '<div class="loading-spinner">⏳ Loading...</div>';

    const notes = await fetchData(`lesson_notes?teacher_id=eq.${currentUser.id}&order=created_at.desc`);

    if (!notes || notes.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">📚</div>
          <h3>No Notes Yet</h3>
          <p>Create your first lesson note using the form above.</p>
        </div>`;
      return;
    }

    container.innerHTML = `<div class="notes-grid">${notes.map(n => noteCard(n, true)).join('')}</div>`;
  }

  function noteCard(n, isTeacher = false) {
    return `
      <div class="note-card">
        <div class="note-subject">${n.subject}</div>
        <div class="note-title">${n.title}</div>
        <div class="note-preview">${n.content}</div>
        <div class="note-meta">
          <span class="note-class">${n.class}</span>
          <span>${formatDate(n.created_at)}</span>
        </div>
        <div class="note-actions">
          <button class="action-btn view" onclick='openModal(${JSON.stringify(n)})'>👁️ Read</button>
          ${isTeacher ? `<button class="action-btn delete" onclick="deleteNote('${n.id}')">🗑️ Delete</button>` : ''}
        </div>
      </div>`;
  }

  async function deleteNote(id) {
    if (!confirm('Delete this note?')) return;
    const authToken = localStorage.getItem('ccs_token') || token;
    await fetch(`${SUPABASE_URL}/rest/v1/lesson_notes?id=eq.${id}`, {
      method: 'DELETE',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Accept-Profile': 'public',
        'Content-Profile': 'public'
      }
    });
    loadMyNotes();
  }

  // ── STUDENT VIEW ──
  async function loadStudentView() {
    document.getElementById('mainContent').innerHTML = `
      <div class="page-header">
        <div class="page-label">Study Materials</div>
        <h1 class="page-title">📚 Lesson Notes</h1>
      </div>
      <div class="filter-row">
        <select class="form-select" id="filterSubject">
          <option value="">All Subjects</option>
          <option>Mathematics</option>
          <option>English Language</option>
          <option>Physics</option>
          <option>Chemistry</option>
          <option>Biology</option>
          <option>Economics</option>
          <option>Government</option>
          <option>Literature-in-English</option>
          <option>Further Mathematics</option>
          <option>Accounting</option>
        </select>
        <button class="filter-btn" onclick="loadStudentNotes()">🔍 Filter</button>
      </div>
      <div id="studentNotesContainer">
        <div class="loading-spinner">⏳ Loading...</div>
      </div>
    `;
    loadStudentNotes();
  }

  async function loadStudentNotes() {
    const container = document.getElementById('studentNotesContainer');
    container.innerHTML = '<div class="loading-spinner">⏳ Loading...</div>';

    const studentClass = currentUser.class || currentUser.class_name || '';
    const subject = document.getElementById('filterSubject')?.value || '';

    let endpoint = `lesson_notes?order=created_at.desc`;
    if (studentClass) endpoint += `&class=eq.${encodeURIComponent(studentClass)}`;
    if (subject) endpoint += `&subject=eq.${encodeURIComponent(subject)}`;

    const notes = await fetchData(endpoint);

    if (!notes || notes.error || notes.code) {
      container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📚</div><h3>No Notes Yet</h3><p>Your teachers haven't uploaded any notes yet.</p></div>`;
      return;
    }

    if (notes.length === 0) {
      container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📚</div><h3>No Notes Found</h3><p>No lesson notes available for your class yet. Check back soon!</p></div>`;
      return;
    }

    container.innerHTML = `<div class="notes-grid">${notes.map(n => noteCard(n, false)).join('')}</div>`;
  }

  // ── ADMIN VIEW ──
  async function loadAdminView() {
    document.getElementById('mainContent').innerHTML = `
      <div class="page-header">
        <div class="page-label">Admin — All Lesson Notes</div>
        <h1 class="page-title">📚 All Notes</h1>
      </div>
      <div class="filter-row">
        <select class="form-select" id="adminFilterClass">
          <option value="">All Classes</option>
          <option>JSS 1</option><option>JSS 2</option><option>JSS 3</option>
          <option>SS 1</option><option>SS 2</option><option>SS 3</option>
        </select>
        <button class="filter-btn" onclick="loadAdminNotes()">🔍 Filter</button>
      </div>
      <div id="adminNotesContainer"><div class="loading-spinner">⏳ Loading...</div></div>
    `;
    loadAdminNotes();
  }

  async function loadAdminNotes() {
    const container = document.getElementById('adminNotesContainer');
    container.innerHTML = '<div class="loading-spinner">⏳ Loading...</div>';
    const className = document.getElementById('adminFilterClass')?.value || '';
    let endpoint = `lesson_notes?order=created_at.desc`;
    if (className) endpoint += `&class=eq.${encodeURIComponent(className)}`;
    const notes = await fetchData(endpoint);
    if (!notes || notes.length === 0) {
      container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📚</div><h3>No Notes Yet</h3><p>No lesson notes have been created yet.</p></div>`;
      return;
    }
    container.innerHTML = `<div class="notes-grid">${notes.map(n => noteCard(n, true)).join('')}</div>`;
  }

  function logout() {
    localStorage.removeItem('ccs_token');
    localStorage.removeItem('ccs_user');
    window.location.href = 'portal.html';
  }

  // Close modal on background click
  document.getElementById('noteModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  window.addEventListener('load', () => {
    token = localStorage.getItem('ccs_token');
    const userStr = localStorage.getItem('ccs_user');
    if (!token || !userStr) { window.location.href = 'portal.html'; return; }
    currentUser = JSON.parse(userStr);
    document.getElementById('navUser').textContent = currentUser.full_name || currentUser.email;
    if (currentUser.role === 'teacher') loadTeacherView();
    else if (currentUser.role === 'student') loadStudentView();
    else if (currentUser.role === 'admin') loadAdminView();
  });
</script>
</body>
</html>
